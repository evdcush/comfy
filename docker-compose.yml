name: comfyui

# SERVING:
# tailscale serve --bg --https=443 --set-path=/comfy \
#   http://127.0.0.1:${COMFYUI_PORT:-8188}
#
# The browser UI is still most reliable at:
# http://127.0.0.1:${COMFYUI_PORT:-8188}

networks:
  ai-backend:
    external: true

services:
  comfyui:
    image: mmartial/comfyui-nvidia-docker:ubuntu24_cuda13.0-20260805
    container_name: comfyui
    init: true
    restart: unless-stopped

    # The image tag itself is pinned, so don't re-pull it on every start.
    pull_policy: if_not_present

    ports:
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"

    environment:
      # mmartial container configuration
      USE_UV: "true"

      # IMPORTANT:
      # Leave upgrades enabled for the FIRST successful initialization of a
      # brand-new ./data/run directory. After it is working and pinned, change
      # this to "true".
      DISABLE_UPGRADES: "false"

      WANTED_UID: "${WANTED_UID:-1000}"
      WANTED_GID: "${WANTED_GID:-1000}"

      # All persistent user/model/input/output content lives below /basedir.
      BASE_DIRECTORY: /basedir
      SECURITY_LEVEL: normal

      # Enable current ComfyUI Manager through the image's supported mechanism.
      USE_NEW_MANAGER: "true"
      ENABLE_MANAGER_LEGACY_UI: "false"

      # For the ACE-Step validation baseline:
      # use ordinary PyTorch attention, not SageAttention or --fast.
      COMFY_CMDLINE_EXTRA: "--use-pytorch-cross-attention"

      # Shared Hugging Face / Torch caches under your model tree.
      HF_HOME: /basedir/models/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /basedir/models/.cache/huggingface/hub
      TORCH_HOME: /basedir/models/.cache/torch

      # Both 4090s visible for now.
      NVIDIA_VISIBLE_DEVICES: "0,1"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

      # Privacy / telemetry convention.
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"

      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

    volumes:
      # REQUIRED by mmartial.
      #
      # Contains:
      #   ComfyUI source
      #   Python virtualenv
      #   pip/uv caches
      #   runtime configuration
      - type: bind
        source: ./data/run
        target: /comfy/mnt

      # General persistent ComfyUI user state.
      - type: bind
        source: ./data/basedir
        target: /basedir

      # Keep the large model tree outside application data.
      # This more-specific mount overrides /basedir/models from the mount above.
      - type: bind
        source: /home/evan/Models/comfy
        target: /basedir/models

      # Keep your existing data hierarchy for user-facing files.
      - type: bind
        source: ./data/input
        target: /basedir/input

      - type: bind
        source: ./data/output
        target: /basedir/output

      - type: bind
        source: ./data/workflows
        target: /basedir/user/default/workflows

      # mmartial looks here for startup scripts.
      - type: bind
        source: ./data/user-scripts
        target: /userscripts_dir
        read_only: true

    ipc: host

    networks:
      - ai-backend

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8188/system_stats',
          timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]
              capabilities:
                - gpu
                - compute
                - utility
